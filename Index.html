<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishok Bazer - কৃষক বাজার</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','Hind Siliguri','sans-serif'], bn: ['Hind Siliguri','sans-serif'] } } } }
</script>
<style>*{font-family:'Inter','Hind Siliguri',sans-serif}.bn{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-[#f8faf6] text-zinc-900">
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-zinc-100">
  <div class="max-w-[1280px] mx-auto px-4 py-3 flex items-center gap-3">
    <div class="flex items-center gap-2.5"><div class="w-9 h-9 rounded-xl bg-[#1a8a2e] flex items-center justify-center text-white">🌾</div><div class="leading-tight"><div class="font-bold text-[15px]">Krishok Bazer</div><div class="bn text-[11px] text-zinc-500">কৃষক বাজার</div></div></div>
    <div class="flex-1 ml-2 md:ml-6 max-w-[520px]"><div class="relative"><input id="search" placeholder="পণ্য খুঁজুন..." class="w-full h-10 pl-10 pr-4 rounded-full bg-zinc-100 border border-transparent outline-none text-[14px]"><svg class="absolute left-3.5 top-2.5 w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg></div></div>
    <button id="cartBtn" class="ml-auto relative w-10 h-10 rounded-full bg-zinc-900 text-white flex items-center justify-center">🛒<span id="cartCount" class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-[#1a8a2e] text-white text-[11px] font-bold flex items-center justify-center">0</span></button>
  </div>
</header>
<main class="max-w-[1280px] mx-auto px-4 pb-24">
  <div class="mt-5 rounded-[24px] bg-[#1a8a2e] text-white p-5 md:p-7 relative overflow-hidden"><div class="relative z-10"><div class="inline-flex text-[11px] bg-white/15 px-2.5 py-1 rounded-full mb-3">🌱 সরাসরি কৃষকের কাছ থেকে</div><h1 class="text-[22px] md:text-[32px] font-bold leading-[1.1]">তাজা, খাঁটি, গ্রামের স্বাদ ঘরে</h1><p class="bn text-white/80 text-[13px] mt-2">প্রতিদিনের বাজার এখন অনলাইনে</p></div><div class="absolute right-0 bottom-0 opacity-20 text-[120px]">🌾</div></div>
  <div class="mt-6 flex items-center justify-between"><h2 class="font-bold text-[18px]">সকল পণ্য <span id="count" class="text-[12px] px-2 py-0.5 rounded-full bg-zinc-100"></span></h2><button id="toggleAdmin" class="text-[13px] px-3 py-1.5 rounded-full border bg-white">+ নতুন পণ্য</button></div>
  <div id="admin" class="hidden mt-4 p-4 rounded-2xl bg-white border"><h3 class="bn font-semibold text-[14px] mb-3">অ্যাডমিন - নতুন পণ্য</h3><div class="grid md:grid-cols-3 gap-3"><input id="pName" placeholder="নাম" class="h-11 px-4 rounded-xl bg-zinc-50 border"><input id="pPrice" type="number" placeholder="দাম" class="h-11 px-4 rounded-xl bg-zinc-50 border"><input id="pImage" placeholder="ছবির URL" class="h-11 px-4 rounded-xl bg-zinc-50 border"></div><button id="addProductBtn" class="mt-3 h-11 px-6 rounded-xl bg-zinc-900 text-white">যোগ করুন</button><div id="adminMsg" class="text-[13px] mt-2"></div></div>
  <div id="grid" class="mt-5 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5"></div>
  <div id="loading" class="mt-8 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
  <div id="empty" class="hidden py-20 text-center">🥬 কোন পণ্য নেই</div>
</main>
<div id="drawer" class="fixed inset-0 z-[60] hidden"><div id="overlay" class="absolute inset-0 bg-zinc-900/30"></div><div class="absolute right-0 top-0 h-full w-full max-w-[420px] bg-white flex flex-col"><div class="p-5 border-b flex justify-between"><div class="font-bold">🛒 ঝুড়ি <span id="drawerCount"></span></div><button id="closeDrawer">✕</button></div><div id="cartList" class="flex-1 overflow-auto p-4 space-y-3"></div><div class="p-5 border-t bg-zinc-50"><div class="flex justify-between"><span>মোট</span><span id="total" class="font-bold text-[18px]">৳ 0</span></div><button id="checkout" class="mt-4 w-full h-12 rounded-xl bg-[#1a8a2e] text-white font-semibold">চেকআউট</button></div></div></div>
<div id="success" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-zinc-900/40"><div class="bg-white rounded-[24px] p-8 max-w-[360px] w-full text-center"><div class="w-16 h-16 rounded-full bg-[#1a8a2e]/10 text-[#1a8a2e] flex items-center justify-center mx-auto text-3xl">✓</div><h3 class="bn mt-4 font-bold text-[20px]">অর্ডার সফল হয়েছে!</h3><p class="bn text-[13px] text-zinc-500 mt-1">অর্ডার গ্রহণ করা হয়েছে।</p><button id="closeSuccess" class="mt-6 w-full h-11 rounded-xl bg-zinc-900 text-white">Continue</button></div></div>
<script>
const const API = "https://bitter-math-d9a1.krishokbazer.workers.dev/api/products";
let products = []; let cart = [];
const grid=document.getElementById('grid'),loadingEl=document.getElementById('loading'),emptyEl=document.getElementById('empty'),countEl=document.getElementById('count'),cartCount=document.getElementById('cartCount'),drawerCount=document.getElementById('drawerCount'),cartList=document.getElementById('cartList'),totalEl=document.getElementById('total'),search=document.getElementById('search');
function skeleton(){loadingEl.innerHTML=Array(8).fill(0).map(()=>'<div class="rounded-[20px] bg-white border overflow-hidden animate-pulse"><div class="aspect-[4/3] bg-zinc-100"></div><div class="p-3 space-y-2"><div class="h-3 bg-zinc-100 rounded w-3/4"></div><div class="h-3 bg-zinc-100 rounded w-1/2"></div></div></div>').join('');}
skeleton();
async function fetchProducts(){try{const r=await fetch(API);products=await r.json();loadingEl.innerHTML='';render();}catch(e){loadingEl.innerHTML='<div class="py-10 text-center">লোড সমস্যা</div>';}}
function filtered(){const q=search.value.toLowerCase();return products.filter(p=>(p.name||'').toLowerCase().includes(q));}
function render(){const list=filtered();countEl.textContent=list.length+' টি';if(list.length===0){grid.innerHTML='';emptyEl.classList.remove('hidden');return;}emptyEl.classList.add('hidden');grid.innerHTML=list.map(p=>'<div class="rounded-[20px] bg-white border overflow-hidden"><div class="aspect-[4/3] bg-[#f6f7f4] relative"><img src="'+p.image+'" class="w-full h-full object-cover" onerror="this.style.display=\'none\'"><div class="absolute top-2 left-2 text-[10px] px-2 py-1 rounded-full bg-white/90">Fresh</div></div><div class="p-3.5"><div class="font-medium text-[14px]">'+p.name+'</div><div class="mt-2 flex justify-between items-end"><div><div class="text-[11px] text-zinc-400">দাম</div><div class="font-bold">৳ '+Number(p.price).toLocaleString()+'</div></div><button onclick="addToCart(\''+p.id+'\')" class="h-8 px-3.5 rounded-full bg-zinc-900 text-white text-[12px]">+ Add</button></div></div></div>').join('');}
function addToCart(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const ex=cart.find(c=>String(c.id)===String(id));if(ex)ex.qty++;else cart.push({...p,qty:1});updateCart();openDrawer();}
function updateCart(){const totalQty=cart.reduce((s,c)=>s+c.qty,0);cartCount.textContent=totalQty;drawerCount.textContent=totalQty+' টি';const total=cart.reduce((s,c)=>s+Number(c.price)*c.qty,0);totalEl.textContent='৳ '+total.toLocaleString();cartList.innerHTML=cart.length===0?'<div class="py-20 text-center text-zinc-400">ঝুড়ি খালি</div>':cart.map(c=>'<div class="flex gap-3 p-3 rounded-2xl bg-zinc-50 border"><img src="'+c.image+'" class="w-14 h-14 rounded-xl object-cover" onerror="this.style.display=\'none\'"><div class="flex-1"><div class="text-[13px] font-medium">'+c.name+'</div><div class="font-bold">৳ '+Number(c.price).toLocaleString()+'</div><div class="flex gap-2 mt-1"><button onclick="changeQty(\''+c.id+'\',-1)" class="w-6 h-6 rounded-full bg-white border">-</button><span>'+c.qty+'</span><button onclick="changeQty(\''+c.id+'\',1)" class="w-6 h-6 rounded-full bg-white border">+</button><button onclick="removeItem(\''+c.id+'\')" class="ml-auto text-[11px] text-red-500">Remove</button></div></div></div>').join('');}
function changeQty(id,d){const it=cart.find(c=>String(c.id)===String(id));if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>String(c.id)!==String(id));updateCart();}
function removeItem(id){cart=cart.filter(c=>String(c.id)!==String(id));updateCart();}
function openDrawer(){document.getElementById('drawer').classList.remove('hidden');document.getElementById('drawer').classList.add('flex');}
function closeDrawer(){document.getElementById('drawer').classList.add('hidden');}
document.getElementById('cartBtn').onclick=openDrawer;document.getElementById('overlay').onclick=closeDrawer;document.getElementById('closeDrawer').onclick=closeDrawer;search.oninput=render;
document.getElementById('checkout').onclick=()=>{if(cart.length===0)return;cart=[];updateCart();closeDrawer();document.getElementById('success').classList.remove('hidden');document.getElementById('success').classList.add('flex');};
document.getElementById('closeSuccess').onclick=()=>{document.getElementById('success').classList.add('hidden');};
document.getElementById('toggleAdmin').onclick=()=>document.getElementById('admin').classList.toggle('hidden');
document.getElementById('addProductBtn').onclick=async()=>{const name=document.getElementById('pName').value.trim(),price=document.getElementById('pPrice').value.trim(),image=document.getElementById('pImage').value.trim(),msg=document.getElementById('adminMsg');if(!name||!price||!image){msg.textContent='সব ঘর পূরণ করুন';return;}msg.textContent='যোগ করা হচ্ছে...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price:Number(price),image})});if(!r.ok)throw new Error();msg.textContent='✅ যোগ হয়েছে';fetchProducts();}catch(e){msg.textContent='❌ সমস্যা';}};
fetchProducts();updateCart();
</script>
</body>
</html>

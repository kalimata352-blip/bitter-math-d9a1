<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রসেনজিৎ অনলাইন শপ - ভোটার কার্ড একবারই</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Bengali',sans-serif}</style>
</head>
<body class="bg-gray-50">
<header class="bg-green-600 text-white p-4 sticky top-0 z-20 shadow">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="font-bold text-xl">🛒 প্রসেনজিৎ অনলাইন শপ</h1>
    <button id="cartBtn" class="bg-white text-green-600 px-3 py-1 rounded-full font-bold text-sm">কার্ট (<span id="cartCount">0</span>)</button>
  </div>
</header>
<div class="bg-red-600 text-white text-center py-2 font-bold text-xs">🔒 সার্ভারে লক - এক ভোটার কার্ড একবারই, যেকোনো ফোন থেকে দুবার হবে না</div>

<main class="max-w-6xl mx-auto p-3 space-y-5">
  <div class="bg-white rounded-xl p-4 shadow-sm">
    <h2 class="font-bold text-center">প্রোডাক্ট</h2>
    <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3"><p class="col-span-full text-center py-6 text-gray-400">লোড হচ্ছে...</p></div>
  </div>

  <div class="bg-white rounded-xl shadow-lg border-2 border-green-600 overflow-hidden">
    <div class="bg-green-600 text-white p-4">
      <h2 class="text-lg font-bold">📄 অনলাইন বায়োডাটা - ভোটার কার্ড MUST & UNIQUE</h2>
      <p class="text-xs mt-1">একই ভোটার কার্ড সার্ভারে একবারই জমা হবে। 6295633283</p>
    </div>
    
    <form id="jobForm" class="p-5 space-y-4">
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-sm font-bold">নাম *</label><input type="text" id="fullName" required class="w-full border rounded-lg p-2.5 mt-1 text-sm"></div>
        <div><label class="text-sm font-bold">মোবাইল *</label><input type="tel" id="mobile" required class="w-full border rounded-lg p-2.5 mt-1 text-sm"></div>
      </div>
      <div><label class="text-sm font-bold">ঠিকানা *</label><textarea id="address" required rows="2" class="w-full border rounded-lg p-2.5 mt-1 text-sm"></textarea></div>

      <div class="bg-yellow-50 border-2 border-red-500 rounded-lg p-3">
        <label class="text-sm font-bold text-red-700">ভোটার কার্ড নম্বর * (সার্ভারে একবারই)</label>
        <div class="flex gap-2 mt-1">
          <input type="text" id="voterNo" required placeholder="ABC1234567" class="flex-1 border-2 border-red-400 rounded-lg p-2.5 text-sm font-bold uppercase">
          <button type="button" id="checkBtn" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs font-bold">চেক করুন</button>
        </div>
        <div id="voterStatus" class="text-xs mt-2 font-bold"></div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-sm font-bold">আধার</label><input type="text" id="aadhaar" class="w-full border rounded-lg p-2.5 mt-1 text-sm"></div>
        <div><label class="text-sm font-bold">শিক্ষা</label><select id="education" class="w-full border rounded-lg p-2.5 mt-1 text-sm"><option>মাধ্যমিক</option><option>উচ্চ মাধ্যমিক</option><option>গ্র্যাজুয়েট</option></select></div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">✅ জমা দিন - সার্ভারে চেক হবে</button>
      <p id="formMsg" class="text-center text-sm font-bold"></p>
    </form>
  </div>
</main>

<script>
// === তোমার WORKER URL এখানে বসাও ===
const WORKER_BASE = "https://bazer.workers.dev"; 
// যদি bazer না চলে, নিচেরটা ব্যবহার করো
// const WORKER_BASE = "https://prasenjit-shop-api.krishokbazer.workers.dev";
// const WORKER_BASE = "https://krishokbazer.workers.dev";

let cart=[], allProducts=[];
async function load(){
  try{
    let urls=[`${WORKER_BASE}/api/products`,"https://bazer.workers.dev/api/products","https://krishokbazer.workers.dev/api/products"];
    let data=null; for(let u of urls){ try{ const r=await fetch(u); if(r.ok){ data=await r.json(); if(data && data.length>0) break; } }catch(e){} }
    if(!data) data=[{id:1,name:"পেঁয়াজ ১ কেজি",price:50},{id:2,name:"আলু ১ কেজি",price:40}];
    allProducts=data; const box=document.getElementById('products'); box.innerHTML='';
    allProducts.forEach(p=>{
      let img=p.image||'https://via.placeholder.co/300?text='+encodeURIComponent(p.name); if(img.includes('via.placeholder.com')) img=img.replace('via.placeholder.com','via.placeholder.co');
      box.innerHTML+=`<div class="bg-white border rounded-xl overflow-hidden flex flex-col"><img src="${img}" class="w-full h-28 object-cover"><div class="p-2 flex flex-col flex-1"><h3 class="text-sm font-semibold">${p.name}</h3><p class="text-green-600 font-bold text-sm">₹${p.price}</p><button onclick="add(${p.id})" class="mt-2 bg-green-600 text-white py-1 rounded text-xs font-bold">যোগ করুন</button></div></div>`;
    });
  }catch(e){}
}
function add(id){ const pr=allProducts.find(x=>x.id==id); const ex=cart.find(x=>x.id==id); if(ex) ex.qty++; else cart.push({...pr,qty:1}); document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0); }
load();

// ভোটার চেক - সার্ভার থেকে
async function checkVoterServer(voterNo){
  const status = document.getElementById('voterStatus');
  const btn = document.getElementById('submitBtn');
  if(!voterNo){ status.textContent=''; return false; }
  status.textContent='⏳ সার্ভারে চেক হচ্ছে...';
  status.className='text-xs mt-2 font-bold text-blue-600';
  try{
    const res = await fetch(`${WORKER_BASE}/api/check-voter?voter_no=${encodeURIComponent(voterNo)}`);
    const data = await res.json();
    if(data.exists){
      status.textContent='❌ এই ভোটার কার্ড সার্ভারে আগেই জমা আছে! দুবার হবে না।';
      status.className='text-xs mt-2 font-bold text-red-600';
      btn.disabled=true; btn.textContent='❌ ইতিমধ্যে জমা আছে'; btn.classList.add('bg-gray-400'); btn.classList.remove('bg-green-600');
      return true; // exists = duplicate
    } else {
      status.textContent='✅ এই ভোটার কার্ড এখনো জমা হয়নি, জমা দিতে পারবেন';
      status.className='text-xs mt-2 font-bold text-green-600';
      btn.disabled=false; btn.textContent='✅ জমা দিন - সার্ভারে চেক হবে'; btn.classList.remove('bg-gray-400'); btn.classList.add('bg-green-600');
      return false;
    }
  }catch(e){
    status.textContent='⚠️ সার্ভার চেক করা যায়নি, তবুও চেষ্টা করুন (লোকাল চেক হবে)';
    status.className='text-xs mt-2 font-bold text-yellow-600';
    return false;
  }
}

document.getElementById('voterNo').addEventListener('blur', function(){ checkVoterServer(this.value.trim().toUpperCase()); });
document.getElementById('checkBtn').addEventListener('click', function(){ const v=document.getElementById('voterNo').value.trim().toUpperCase(); document.getElementById('voterNo').value=v; checkVoterServer(v); });

document.getElementById('jobForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const voterNo = document.getElementById('voterNo').value.trim().toUpperCase();
  if(!voterNo){ alert('ভোটার কার্ড MUST'); return; }

  // আগে সার্ভারে চেক
  const isDuplicate = await checkVoterServer(voterNo);
  if(isDuplicate){
    alert('⛔ এই ভোটার কার্ড দিয়ে আগেই আবেদন করা হয়েছে! সার্ভারে একবারই জমা হবে।');
    return;
  }

  const payload = {
    name: document.getElementById('fullName').value,
    mobile: document.getElementById('mobile').value,
    address: document.getElementById('address').value,
    voterNo: voterNo,
    aadhaar: document.getElementById('aadhaar').value,
    edu: document.getElementById('education').value
  };

  const msgEl = document.getElementById('formMsg');
  msgEl.textContent='⏳ সার্ভারে জমা হচ্ছে...';
  msgEl.className='text-center text-sm font-bold text-blue-600';

  try{
    const res = await fetch(`${WORKER_BASE}/api/apply`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    
    if(!res.ok || !result.success){
      if(result.duplicate){
        msgEl.textContent='❌ '+result.error;
        msgEl.className='text-center text-sm font-bold text-red-600';
        alert(result.error);
      } else {
        throw new Error(result.error || 'Error');
      }
      return;
    }

    msgEl.textContent='✅ সার্ভারে জমা হয়েছে! WhatsApp খুলছে... আর দুবার হবে না।';
    msgEl.className='text-center text-sm font-bold text-green-600';

    // WhatsApp এ পাঠানো
    let waMsg = `*নতুন আবেদন*%0Aনাম: ${payload.name}%0Aমোবাইল: ${payload.mobile}%0Aভোটার: ${payload.voterNo} ✅ UNIQUE%0Aঠিকানা: ${payload.address}`;
    setTimeout(()=>{ window.open('https://wa.me/916295633283?text='+waMsg,'_blank'); }, 800);
    e.target.reset();
    document.getElementById('voterStatus').textContent='';

  }catch(err){
    msgEl.textContent='❌ Error: '+err.message+' - D1 bind করা আছে কিনা দেখো, /api/init খোলো';
    msgEl.className='text-center text-sm font-bold text-red-600';
  }
});
</script>
</body>
</html>

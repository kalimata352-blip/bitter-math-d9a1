<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishok Bazer - কৃষক বাজার</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#f5f5f5;padding:15px;margin:0;color:#111}
.card{background:white;padding:20px;border-radius:12px;max-width:900px;margin:0 auto 20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{margin:0 0 5px;font-size:22px} h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.subtitle{font-size:12px;color:#666;margin:0 0 15px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#111;box-shadow:0 0 0 2px rgba(0,0,0,.08)} input:invalid{border-color:#ef4444}
label{font-weight:600;font-size:13px;margin-top:10px;display:block}
.hint{font-size:12px;color:#666;margin:-2px 0 8px 2px}
button{background:#111;color:white;padding:11px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
button:hover{background:#222} .btn-full{width:100%;margin-top:12px} .btn-small{padding:6px 12px;font-size:12px;background:#e5e7eb;color:#111}
table{width:100%;border-collapse:collapse;margin-top:10px} th,td{border:1px solid #eee;padding:8px;text-align:left;font-size:14px;word-break:break-all} th{background:#f9fafb}
.tabs{display:flex;gap:10px;margin-top:10px} .tabs button{background:#e5e7eb;color:#111} .tabs button.active{background:#111;color:white}
.alert{padding:10px;border-radius:8px;margin:10px 0;font-size:14px} .error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca} .success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
</style>
</head>
<body>
<div class="card">
<h1>Krishok Bazer - কৃষক বাজার 🛒</h1>
<p class="subtitle">API: bitter-math-d9a1.krishokbazer.workers.dev | India Format Fixed</p>
<div class="tabs">
<button id="tab-kormi" class="active" onclick="switchTab('kormi')">কর্মী</button>
<button id="tab-products" onclick="switchTab('products')">প্রোডাক্ট</button>
</div>
</div>

<div id="view-kormi">
<div class="card">
<h2>কর্মী যোগ করুন</h2>
<div id="msgKormi"></div>
<label>নাম</label><input id="name" placeholder="যেমন: রমেশ মন্ডল">
<label>ফোন</label><input id="phone" placeholder="যেমন: 9876543210" type="tel">
<label>বয়স</label><input id="age" placeholder="যেমন: 28" type="number" min="18" max="70">
<label>অভিজ্ঞতা</label><input id="experience" placeholder="যেমন: 5 বছর চাষের কাজ">
<label>ঠিকানা</label><input id="address" placeholder="Diamond Harbour, South 24 Parganas">
<label>1. Voter Card *</label><input id="voter_card" placeholder="ABC1234567" pattern="[A-Z]{3}[0-9]{7}" maxlength="10" required><div class="hint">3 অক্ষর + 7 সংখ্যা - উদা: ABC1234567</div>
<label>2. Mobile Number *</label><input id="mobile_number" placeholder="9876543210" type="tel" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric" required><div class="hint">10 সংখ্যা, 6-9 দিয়ে শুরু</div>
<label>3. Pin Code *</label><input id="pin_code" placeholder="743331" type="text" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" required><div class="hint">6 সংখ্যা - উদা: 743331</div>
<button onclick="addKormi()" class="btn-full">যোগ করুন</button>
</div>
<div class="card">
<h2>কর্মী লিস্ট <button onclick="loadKormi()" class="btn-small">রিফ্রেশ</button></h2>
<table id="kormiTable"><thead><tr><th>ID</th><th>নাম</th><th>Mobile</th><th>Voter</th><th>Pin</th><th>Action</th></tr></thead><tbody></tbody></table>
</div>
</div>

<div id="view-products" style="display:none">
<div class="card">
<h2>প্রোডাক্ট যোগ করুন</h2>
<div id="msgProd"></div>
<label>প্রোডাক্ট নাম</label><input id="p_name" placeholder="যেমন: দেশি আলু">
<label>দাম (₹)</label><input id="p_price" placeholder="30" type="number">
<label>Image URL</label><input id="p_image" placeholder="https://...">
<button onclick="addProduct()" class="btn-full">যোগ করুন</button>
</div>
<div class="card">
<h2>প্রোডাক্ট লিস্ট <button onclick="loadProducts()" class="btn-small">রিফ্রেশ</button></h2>
<table id="prodTable"><thead><tr><th>ID</th><th>নাম</th><th>দাম</th><th>Image</th><th>Action</th></tr></thead><tbody></tbody></table>
</div>
</div>

<script>
const API_BASE = "https://bitter-math-d9a1.krishokbazer.workers.dev";
function switchTab(t){
  document.getElementById('view-kormi').style.display = t==='kormi'?'block':'none';
  document.getElementById('view-products').style.display = t==='products'?'block':'none';
  document.getElementById('tab-kormi').classList.toggle('active', t==='kormi');
  document.getElementById('tab-products').classList.toggle('active', t==='products');
  if(t==='kormi') loadKormi(); else loadProducts();
}
document.addEventListener('DOMContentLoaded', ()=>{
  const v=document.getElementById('voter_card');
  if(v) v.addEventListener('input', e=> e.target.value=e.target.value.toUpperCase());
  loadKormi();
});
function validateIndian(){
  const m=document.getElementById('mobile_number').value.trim();
  const p=document.getElementById('pin_code').value.trim();
  const v=document.getElementById('voter_card').value.trim();
  if(!/^[A-Z]{3}[0-9]{7}$/.test(v)) throw new Error("Voter Card ভুল! ABC1234567 ফরম্যাটে লিখুন");
  if(!/^[6-9][0-9]{9}$/.test(m)) throw new Error("Mobile ভুল! 10 সংখ্যা, 6-9 দিয়ে শুরু");
  if(!/^[0-9]{6}$/.test(p)) throw new Error("Pin Code ভুল! 6 সংখ্যা লিখুন যেমন 743331");
}
async function addKormi(){
  const data={name:name.value,phone:phone.value,age:age.value,experience:experience.value,address:address.value,voter_card:voter_card.value.trim(),mobile_number:mobile_number.value.trim(),pin_code:pin_code.value.trim()};
  const msg=document.getElementById('msgKormi');
  try{
    validateIndian();
    const res=await fetch(`${API_BASE}/api/kormi`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const out=await res.json();
    if(!res.ok) throw new Error(out.message||out.error);
    msg.innerHTML=`<div class="alert success">${out.message||'কর্মী যোগ হয়েছে!'}</div>`;
    loadKormi(); voter_card.value=''; mobile_number.value=''; pin_code.value='';
  }catch(e){msg.innerHTML=`<div class="alert error">${e.message}</div>`;}
}
async function loadKormi(){
  try{
    const res=await fetch(`${API_BASE}/api/kormi`);
    const list=await res.json();
    document.querySelector('#kormiTable tbody').innerHTML=list.map(s=>`<tr><td>${s.id}</td><td>${s.name||''}</td><td>${s.mobile_number||s.phone||''}</td><td>${s.voter_card||''}</td><td>${s.pin_code||''}</td><td><button onclick="delKormi(${s.id})" class="btn-small">Delete</button></td></tr>`).join('')||'<tr><td colspan=6>কোনো কর্মী নেই</td></tr>';
  }catch(e){console.error(e)}
}
async function delKormi(id){ if(!confirm('Delete করবে?')) return; await fetch(`${API_BASE}/api/kormi?id=${id}`,{method:'DELETE'}); loadKormi(); }
async function addProduct(){
  const data={name:p_name.value,price:p_price.value,image:p_image.value};
  const msg=document.getElementById('msgProd');
  try{
    if(!data.name||!data.price) throw new Error("নাম ও দাম লাগবে");
    const res=await fetch(`${API_BASE}/api/products`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const out=await res.json(); if(!res.ok) throw new Error(out.error||out.message);
    msg.innerHTML=`<div class="alert success">Product যোগ হয়েছে</div>`; loadProducts(); p_name.value=''; p_price.value=''; p_image.value='';
  }catch(e){msg.innerHTML=`<div class="alert error">${e.message}</div>`;}
}
async function loadProducts(){
  try{
    const res=await fetch(`${API_BASE}/api/products`);
    const list=await res.json();
    document.querySelector('#prodTable tbody').innerHTML=list.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.price}</td><td style="max-width:120px;overflow:hidden">${p.image||''}</td><td><button onclick="delProd(${p.id})" class="btn-small">Delete</button></td></tr>`).join('')||'<tr><td colspan=5>কোনো প্রোডাক্ট নেই</td></tr>';
  }catch(e){console.error(e)}
}
async function delProd(id){ if(!confirm('Delete করবে?')) return; await fetch(`${API_BASE}/api/products?id=${id}`,{method:'DELETE'}); loadProducts(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prasenjit Shop - Voter Card Must</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-gray-50 min-h-screen">
<header class="bg-green-600 text-white p-3 sticky top-0 z-20 shadow">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="font-bold">🌾 কৃষক বাজার</h1>
    <div class="flex gap-2">
      <button onclick="showTab('products')" id="tab-products" class="bg-white text-green-700 px-3 py-1 rounded-full font-bold text-xs">প্রোডাক্ট</button>
      <button onclick="showTab('kormi')" id="tab-kormi" class="bg-green-800 text-white px-3 py-1 rounded-full text-xs">কর্মী নিয়োগ</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-3">
  <div id="section-products">
    <div id="status" class="text-center py-2 text-xs text-gray-500"></div>
    <div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
  </div>

  <div id="section-kormi" class="hidden">
    <div class="bg-yellow-50 border-l-4 border-yellow-500 p-3 mb-3 text-sm">
      <b>নিয়ম:</b> ভোটার কার্ড বাধ্যতামূলক। একই ভোটার কার্ড দিয়ে ২ বার আবেদন করা যাবে না। অন্য সার্ভার থেকে কাজ করবে না।
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold mb-3">কর্মী আবেদন ফর্ম</h3>
        <input id="kName" placeholder="পুরো নাম *" class="border p-2 rounded w-full mb-2">
        <input id="kPhone" placeholder="ফোন নম্বর *" class="border p-2 rounded w-full mb-2">
        <input id="kVoter" placeholder="ভোটার কার্ড নম্বর * - যেমন: ABC1234567" class="border-2 border-red-300 p-2 rounded w-full mb-2 font-mono uppercase" style="text-transform:uppercase">
        <input id="kRole" placeholder="কাজের ধরন - যেমন: ডেলিভারি" class="border p-2 rounded w-full mb-2">
        <button onclick="addKormi()" class="w-full bg-blue-600 text-white rounded p-2 font-bold">আবেদন জমা দিন</button>
        <p id="kormiMsg" class="text-sm mt-2 font-bold"></p>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold mb-2">আবেদন তালিকা (ভোটার কার্ড সহ)</h3>
        <div id="kormiStatus" class="text-xs text-gray-500"></div>
        <div id="kormiList" class="space-y-2 mt-2 max-h-[60vh] overflow-auto"></div>
      </div>
    </div>
  </div>
</main>

<script>
const API_BASE = "https://bitter-math-d9a1.krishokbazer.workers.dev";
const API_PRODUCTS = API_BASE + "/api/products";
const API_KORMI = API_BASE + "/api/kormi";

function showTab(tab){
  document.getElementById('section-products').classList.toggle('hidden', tab!=='products');
  document.getElementById('section-kormi').classList.toggle('hidden', tab!=='kormi');
  document.getElementById('tab-products').className = tab==='products' ? 'bg-white text-green-700 px-3 py-1 rounded-full font-bold text-xs' : 'bg-green-800 text-white px-3 py-1 rounded-full text-xs';
  document.getElementById('tab-kormi').className = tab==='kormi' ? 'bg-white text-blue-700 px-3 py-1 rounded-full font-bold text-xs' : 'bg-green-800 text-white px-3 py-1 rounded-full text-xs';
  if(tab==='kormi') loadKormi(); else loadProducts();
}
async function loadProducts(){
  const grid=document.getElementById('products');
  const status=document.getElementById('status');
  try{
    const res=await fetch(API_PRODUCTS+"?t="+Date.now());
    const data=await res.json();
    status.textContent = data.length + " টি প্রোডাক্ট";
    grid.innerHTML=data.map(p=>`<div class="bg-white rounded shadow p-2"><img src="${p.image||'https://via.placeholder.com/300'}" class="h-24 w-full object-cover rounded"><p class="font-semibold text-sm mt-1">${p.name}</p><p class="text-green-600 font-bold text-sm">₹${p.price}</p></div>`).join('');
  }catch(e){ status.textContent=e.message; }
}
async function loadKormi(){
  const status=document.getElementById('kormiStatus');
  const list=document.getElementById('kormiList');
  try{
    status.textContent="লোড হচ্ছে...";
    const res=await fetch(API_KORMI+"?t="+Date.now());
    const data=await res.json();
    status.textContent = `${data.length} জন আবেদন করেছে`;
    list.innerHTML = data.map(k=>`
      <div class="border p-2 rounded bg-gray-50 text-sm">
        <p><b>${k.name}</b> - ${k.phone}</p>
        <p class="font-mono text-xs bg-yellow-100 inline-block px-1">Voter: ${k.voter_card}</p>
        <p class="text-xs text-gray-600">${k.role||''} | ${new Date(k.created_at).toLocaleDateString('bn-IN')}</p>
        <button onclick="deleteKormi(${k.id})" class="text-red-500 text-xs mt-1">Delete</button>
      </div>
    `).join('');
  }catch(e){ status.textContent=e.message; }
}
async function addKormi(){
  const name=document.getElementById('kName').value.trim();
  const phone=document.getElementById('kPhone').value.trim();
  let voter_card=document.getElementById('kVoter').value.trim().toUpperCase();
  const role=document.getElementById('kRole').value.trim();
  const msg=document.getElementById('kormiMsg');
  
  if(!name||!phone||!voter_card){ msg.textContent="❌ নাম, ফোন, ভোটার কার্ড সব দিতে হবে"; msg.className="text-sm mt-2 font-bold text-red-600"; return; }
  msg.textContent="জমা হচ্ছে..."; msg.className="text-sm mt-2 text-blue-600";
  
  try{
    const res=await fetch(API_KORMI,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name, phone, voter_card, role})
    });
    const out=await res.json();
    if(res.ok){
      msg.textContent="✅ আবেদন সফল! ভোটার কার্ড: "+voter_card;
      msg.className="text-sm mt-2 font-bold text-green-600";
      document.getElementById('kName').value=""; document.getElementById('kPhone').value=""; document.getElementById('kVoter').value=""; document.getElementById('kRole').value="";
      loadKormi();
    } else {
      msg.textContent="❌ "+(out.error||"Error");
      msg.className="text-sm mt-2 font-bold text-red-600";
    }
  }catch(e){ msg.textContent="❌ "+e.message; msg.className="text-sm mt-2 font-bold text-red-600"; }
}
async function deleteKormi(id){ if(!confirm("Delete?")) return; await fetch(API_KORMI+"?id="+id,{method:"DELETE"}); loadKormi(); }

loadProducts();
</script>
</body>
</html>
